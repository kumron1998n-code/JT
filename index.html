<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⚠ ระบบค้นหาพัสดุ | Xenon Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d90f0f;--dark:#14060a;--fg:#fff;--yellow:#ffe14d;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  font-family:"Kanit","Sarabun","Noto Sans Thai",system-ui,sans-serif;
  color:var(--fg);text-align:center;
  background:var(--red);
  animation:flash .9s steps(1,end) infinite;
  overflow:hidden;
}
@keyframes flash{0%{background:var(--red)}50%{background:var(--dark)}}
@keyframes blinkText{0%{opacity:1}50%{opacity:.15}}
main{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3vh,36px);
  padding:max(clamp(16px,4vw,60px),env(safe-area-inset-top,0px)) clamp(16px,4vw,60px) max(clamp(16px,4vw,60px),env(safe-area-inset-bottom,0px));
  border:clamp(8px,1.6vw,24px) dashed var(--yellow);
  animation:blinkText .9s steps(1,end) infinite;
}
.icon{font-size:clamp(70px,14vw,190px);line-height:1}
h1{margin:0;font-weight:800;font-size:clamp(34px,7.4vw,115px);line-height:1.2;color:var(--yellow)}
p{margin:0;font-weight:600;font-size:clamp(24px,4.8vw,76px);line-height:1.35;max-width:22em}
p b{font-weight:800;color:var(--yellow)}
.reason{font-size:clamp(22px,3.8vw,60px)}
#gate{
  position:fixed;inset:0;z-index:10;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:rgba(0,0,0,.88);color:#fff;font-size:clamp(26px,5vw,64px);font-weight:800;cursor:pointer;
}
#gate small{font-size:.45em;font-weight:400;color:#ccc}
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">🚨</div>
  <h1>เนื่องจากคุณไม่มีสิทธิ์เข้าถึง</h1>
  <p>นอกจากได้รับอนุญาตจากทีมงาน <b>Xenon Studio</b></p>
  <p class="reason">ขอสงวนลิขสิทธิ์ เพราะทีมงาน</p>
</main>

<div id="gate" role="button" tabindex="0">🔊 แตะที่หน้าจอเพื่อดำเนินการต่อ<small>(เบราว์เซอร์ต้องมีการแตะก่อนจึงจะเล่นเสียงได้)</small></div>

<script>
(function(){
  var gate=document.getElementById('gate');
  var audio=null,playing=false;

  // สร้างเสียงไซเรน (WAV) ในตัวไฟล์ ไม่ต้องใช้ไฟล์เสียงภายนอก
  function makeSirenURL(){
    var rate=22050,dur=1.8,n=Math.floor(rate*dur),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    function w(o,t){for(var k=0;k<t.length;k++)v.setUint8(o+k,t.charCodeAt(k));}
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    var ph=0;
    for(var i=0;i<n;i++){
      var t=i/rate,c=(t%0.9)/0.9,tri=c<0.5?c*2:2-c*2;   // กวาดความถี่ขึ้น-ลง
      var f=650+650*tri;
      ph+=2*Math.PI*f/rate;
      var sq=Math.sin(ph)>0?1:-1;                        // คลื่นสี่เหลี่ยม ให้เสียงแหลมดัง
      var val=(0.7*sq+0.3*Math.sin(ph))*0.9;
      v.setInt16(44+i*2,Math.max(-1,Math.min(1,val))*32767,true);
    }
    return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  }

  function play(){
    if(playing)return;
    if(!audio){
      audio=new Audio(makeSirenURL());
      audio.loop=true;audio.volume=1;audio.preload='auto';
    }
    var p=audio.play();
    if(p&&p.then){
      p.then(function(){playing=true;gate.style.display='none';})
       .catch(function(){gate.style.display='flex';});
    }else{playing=true;}
  }

  // ลองเล่นทันทีหลายจังหวะ (ถ้าเบราว์เซอร์อนุญาตจะดังเลย)
  play();
  document.addEventListener('DOMContentLoaded',play);
  window.addEventListener('load',play);
  window.addEventListener('pageshow',play);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)play();});

  // ถ้าถูกบล็อก: แตะ/คลิก/เลื่อน/กดปุ่มที่ไหนก็ได้ครั้งเดียวเสียงจะเริ่มดัง
  ['pointerdown','mousedown','click','touchstart','touchend','keydown','wheel'].forEach(function(ev){
    window.addEventListener(ev,play,{passive:true,capture:true});
  });
  setTimeout(function(){if(!playing)gate.style.display='flex';},400);
})();
</script>
</body>
</html>

<style>
:root{--red:#ED1C24;--red-d:#B4121A;--red-s:rgba(237,28,36,.08);--ink:#15151a;--paper:#f3f3f5;--panel:#fff;--alt:#fafafb;--line:#e8e8ec;--line2:#d9d9df;--text:#1c1c1e;--dim:#7b7b82;--faint:#aeaeb4;--ok:#189e50;--ok-s:#e6f7ed;--info:#2a6fd6;--info-s:#e9f1fd;--warn:#c07d00;--warn-s:#fdf1dc;--dan:#d6362a;--dan-s:#fbe9e7;--neu:#4b4b52;--neu-s:#eeeef0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:'Kanit',sans-serif;min-height:100vh}
.strip{height:5px;background:repeating-linear-gradient(90deg,var(--ink) 0 18px,var(--red) 18px 36px)}
header{padding:32px 6vw 24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;color:#fff;background:linear-gradient(135deg,var(--red),var(--red-d))}
.eyebrow{font:700 11px 'Prompt';letter-spacing:.3em;color:#ffdedc}
.brand{display:flex;align-items:center;gap:12px;margin-top:8px}
.logo{width:52px;height:52px;background:#fff;border-radius:13px;display:flex;align-items:center;justify-content:center;font:italic 800 22px 'Prompt';color:var(--red)}
.name{font:italic 800 28px 'Prompt'}.tag{font:700 10px 'Prompt';letter-spacing:.3em;color:#ffd6d2;margin-top:3px}
h1{margin-top:14px;font:700 24px 'Prompt'}
.plate{font:500 12px 'Prompt';border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);padding:10px 16px;border-radius:10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd479;margin-right:8px}.dot.ok{background:#5be08a}.dot.err{background:#ff9c92}
.controls{padding:24px 6vw 0}
.search{position:relative;max-width:640px}
.search input{width:100%;background:var(--panel);border:1.5px solid var(--line);font:16px 'Kanit';padding:15px 44px 15px 16px;border-radius:12px;outline:none}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 4px var(--red-s)}
.clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:var(--neu-s);cursor:pointer;display:none}
.clear.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;font-weight:500;padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer}
.chip.active{background:var(--red);border-color:var(--red);color:#fff}
.count{margin-top:14px;font-size:13px;color:var(--dim);min-height:18px}.count b{color:var(--red)}
.gen{margin-top:16px;padding:14px 16px;background:var(--panel);border:1.5px dashed var(--line2);border-radius:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.gen b{font:700 12.5px 'Prompt';color:var(--red)}
.gen input{flex:1 1 220px;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font:14px 'Kanit';outline:none}
.btn{font:700 13px 'Prompt';color:#fff;background:var(--red);border:0;border-radius:9px;padding:10px 18px;cursor:pointer}
.btn.sec,.mini{background:var(--neu-s);color:var(--text)}
.mini{font:600 11px 'Prompt';border:0;border-radius:7px;padding:6px 12px;cursor:pointer;color:var(--dim)}
.genres{width:100%;display:none;flex-direction:column;align-items:center;gap:8px;padding:16px;background:var(--alt);border:1px solid var(--line);border-radius:14px}
.genres.show{display:flex}.genres svg{max-width:100%;height:auto}
.grid{padding:20px 6vw 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(20,20,25,.1)}
.badge{display:inline-flex;align-items:center;font:700 10px 'Prompt';padding:5px 11px;border-radius:6px;margin-bottom:12px}
.b-signed{color:var(--ok);background:var(--ok-s)}.b-out{color:var(--info);background:var(--info-s)}.b-pending{color:var(--warn);background:var(--warn-s)}.b-problem{color:var(--dan);background:var(--dan-s)}.b-transit{color:var(--neu);background:var(--neu-s)}
.trk{font:700 16px 'Prompt';margin-bottom:10px;word-break:break-all}
.alert{padding:9px 11px;border-radius:9px;font-size:12px;margin-bottom:12px}
.alert.p{background:var(--warn-s);color:#8a5c00}.alert.x{background:var(--dan-s);color:var(--dan)}
.steps{display:flex;margin:12px 0 14px}
.step{flex:1;text-align:center;font-size:10px;color:var(--faint);position:relative}
.step i{display:block;width:14px;height:14px;margin:0 auto 5px;border-radius:50%;border:2.5px solid var(--line2);background:#fff;position:relative;z-index:1}
.step.d{color:var(--text);font-weight:600}.step.d i{background:var(--red);border-color:var(--red)}
.step:not(:first-child):before{content:"";position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--line2)}
.step.d:not(:first-child):before{background:var(--red)}
.ct{font-size:15.5px;font-weight:600;margin-bottom:3px}.cs{font-size:12.5px;color:var(--dim);line-height:1.5}
.meta{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.cbar{margin-top:10px;width:100%;font:600 11.5px 'Prompt';color:var(--red);background:var(--red-s);border:1px dashed var(--red);border-radius:8px;padding:8px;cursor:pointer}
.empty{grid-column:1/-1;padding:60px 6vw;text-align:center;color:var(--dim)}
.empty h3{font:700 15px 'Prompt';color:var(--text);margin-bottom:6px}
.err{grid-column:1/-1;padding:50px 6vw;text-align:center;color:var(--dim)}
.err code{display:block;margin:12px auto 0;background:var(--alt);border:1px solid var(--line);padding:12px;border-radius:8px;font-size:12px;color:var(--red-d);max-width:520px;text-align:left;white-space:pre-wrap}
.overlay{position:fixed;inset:0;background:rgba(15,15,18,.58);display:flex;align-items:flex-start;justify-content:center;padding:4vh 20px 20px;z-index:9999;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border-radius:20px;max-width:920px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(20,20,25,.25)}
.mhead{padding:24px 28px 18px;position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line)}
.mclose{position:absolute;top:18px;right:18px;width:32px;height:32px;border:0;border-radius:50%;background:var(--neu-s);cursor:pointer;font-size:15px}
.mtrk{font:700 20px 'Prompt';margin:10px 0 3px;word-break:break-all}.msub{font-size:12.5px;color:var(--dim)}
.mbody{padding:18px 28px 28px}
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.cod{display:inline-block;background:var(--warn-s);border:1.5px solid var(--warn);color:#8a5c00;padding:8px 14px;border-radius:9px;margin-bottom:10px;font-weight:600}
.rq{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.stamp{transform:rotate(-2deg);border:2.5px solid var(--red);color:var(--red);background:var(--red-s);padding:7px 14px;border-radius:6px;font:800 18px 'Prompt'}
.qr{background:#fff;padding:6px;border:1px solid var(--line);border-radius:8px;width:74px;height:74px}.qr canvas{width:100%!important;height:100%!important}
.bcbox{border:1px solid var(--line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px}
.bcbox svg{max-width:100%;height:auto}.cap{font-size:11px;color:var(--faint)}
.tlh{font:700 11px 'Prompt';letter-spacing:.09em;color:var(--faint);margin-bottom:14px}
.tl{display:flex;gap:14px;position:relative;padding-bottom:20px}.tl:last-child{padding-bottom:0}
.tl:not(:last-child):after{content:"";position:absolute;top:30px;left:14px;width:2px;bottom:0;background:var(--red)}
.tld{flex:none;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:1}
.tl.warn .tld{background:var(--warn-s);color:var(--warn);border:2px solid var(--warn)}
.tl.danger .tld{background:var(--dan-s);color:var(--dan);border:2px solid var(--dan)}
.tl.ok .tld{background:var(--ok)}
.tll{font-size:14px;font-weight:600;padding-top:4px}.tlt{font-size:12px;color:var(--dim);margin-top:2px}
.tlx{font-size:12.5px;margin-top:5px;background:var(--alt);border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--dim)}
.tl.warn .tlx{background:var(--warn-s);color:#8a5c00;border-color:transparent}.tl.danger .tlx{background:var(--dan-s);color:var(--dan);border-color:transparent}
.panel{background:var(--alt);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.ptitle{font:700 11px 'Prompt';letter-spacing:.08em;color:var(--red);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px}.row+.row{border-top:1px dashed var(--line)}
.row span:first-child{color:var(--dim);white-space:nowrap}.row span:last-child{text-align:right;font-weight:500}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--alt);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12px}.pill i{font-style:normal;color:var(--dim);margin-right:6px}
footer{text-align:center;padding:24px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);background:var(--panel)}
footer b{color:var(--red)}
.dbgb{position:fixed;bottom:16px;right:16px;z-index:60;width:42px;height:42px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer}
.dbg{position:fixed;bottom:66px;right:16px;z-index:60;width:min(420px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:#111;color:#d6ffd6;font:12px/1.6 monospace;border-radius:12px;padding:12px 14px;display:none;white-space:pre-wrap;word-break:break-word}
.dbg.show{display:block}.dbg .w{color:#ffd479}.dbg .e{color:#ff8a80}
@media print{body *{visibility:hidden}.overlay,.overlay *{visibility:visible}.overlay{position:absolute;inset:0;background:#fff;padding:0}.modal{box-shadow:none;max-height:none}.mclose,.mini,.dbgb,.dbg{display:none!important}}
</style>
</head>
<body>
<div class="strip"></div>
<header>
  <div>
    <div class="eyebrow">PARCEL TRACKING DATABASE</div>
    <div class="brand"><div class="logo">J&amp;T</div><div><div class="name">J&amp;T Express</div><div class="tag">ส่งไว ทันใจ ทุกเส้นทาง</div></div></div>
    <h1>ระบบค้นหาสถานะพัสดุ</h1>
  </div>
  <div class="plate"><span class="dot" id="sDot"></span><span id="sText">กำลังเชื่อมต่อ Google Sheet...</span><div id="sSync" style="font-size:10.5px;color:#ffdedc;padding-left:16px"></div></div>
</header>
<div class="controls">
  <div class="search"><input id="q" placeholder="ค้นหาเลขพัสดุ / ชื่อผู้รับ / ชื่อผู้ส่ง / เบอร์โทร / ที่อยู่..."><button class="clear" id="qc">✕</button></div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="gen">
    <b>สร้างบาร์โค้ด</b>
    <input id="bin" placeholder="พิมพ์เลขพัสดุ เช่น JTTH20206383262">
    <button class="btn" id="bgo">สร้างบาร์โค้ด</button>
    <button class="btn sec" id="blast">ใช้เลขพัสดุล่าสุดในระบบ</button>
    <div class="genres" id="gres"><svg id="gsvg"></svg><div class="cap" id="glab"></div>
      <div><button class="mini" id="gdl">ดาวน์โหลด PNG</button> <button class="mini" id="gpr">พิมพ์</button> <button class="mini" id="gcl">ล้าง</button></div></div>
  </div>
</div>
<main id="grid" class="grid"></main>
<footer><b>J&amp;T Express</b> Parcel Search — ข้อมูลซิงก์อัตโนมัติจาก Google Sheet</footer>
<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<button class="dbgb" id="dbgb">🐞</button><div class="dbg" id="dbg"></div>

<script>
const SHEET_ID="1TfNpUugAxDPSdTm_6I90v-tdzn_Snkz6yDSRvA09yPc",GID="0";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dbg(l,...a){const d=document.createElement("div");d.className=l;d.textContent=`[${new Date().toLocaleTimeString("th-TH",{hour12:false})}] `+a.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" ");$("dbg").appendChild(d);console.log(...a)}

/* หัวตารางที่ใช้ (ตรงกับชีตจริง) — แก้ให้ตรง: เลขนำส่ง / เขตพื้นที่ */
const COL={tracking:"เลขนำส่ง",zone_name:"เขตพื้นที่",branch_name:"ชื่อสาขานำจ่าย",branch_arrived:"เวลาที่พัสดุถึงสาขา",delivery_time:"เวลาที่นำจ่ายพัสดุ",courier_name:"ชื่อของพนักงานนำจ่าย",courier_phone:"เบอร์มือถือพนักงานนำจ่ายพัสดุ",pending_time:"เวลาที่พัสดุตกค้าง",pending_reason:"สาเหตุพัสดุตกค้าง",problem_time:"เวลาพัสดุมีปัญหา",problem_reason:"สาเหตุของพัสดุมีปัญหา",sign_time:"เวลาเซ็นรับ",sign_branch:"สาขาเซ็นรับ",signer:"ผู้เซ็นรับ",parcel_type:"ประเภทพัสดุ",weight:"น้ำหนักที่ใช้คิดเงิน",payment_method:"วิธีการชำระเงิน",shipping_fee:"ค่าขนส่งทั้งหมด",cod:"COD",sender_name:"ผู้ส่ง",sender_source:"ลูกค้าผู้ส่ง",sender_phone:"เบอร์โทรผู้ส่ง",recipient_name:"ผู้รับ",recipient_phone:"เบอร์มือถือผู้รับ",recipient_addr:"ที่อยู่ผู้รับ",order_source:"แหล่งที่มาคำสั่งซื้อ"};
const ST={signed:["เซ็นรับแล้ว","b-signed"],out:["กำลังนำจ่าย","b-out"],pending:["ตกค้าง","b-pending"],problem:["มีปัญหา","b-problem"],transit:["อยู่ระหว่างขนส่ง","b-transit"]};
let rows=[],colMap={},active="ทั้งหมด",timer;

const norm=s=>(s||"").replace(/[\u200B-\u200D\uFEFF]/g,"").trim().replace(/\s+/g," ");
function parseCSV(t){t=t.replace(/^\uFEFF/,"");const out=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i],n=t[i+1];
    if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
    else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\r"){}else if(c=="\n"){r.push(f);out.push(r);r=[];f=""}else f+=c}
  if(f.length||r.length){r.push(f);out.push(r)}return out.filter(r=>r.some(x=>x.trim()!==""))}
function buildColMap(hs){colMap={};const miss=[];
  Object.entries(COL).forEach(([k,name])=>{const f=hs.find(h=>h===norm(name));f?colMap[k]=f:(colMap[k]=null,miss.push(name))});
  /* fallback: ถ้าไม่พบคอลัมน์เลขพัสดุ ให้จับคู่แบบหลวมๆ */
  if(!colMap.tracking){const f=hs.find(h=>/เลข(นำส่ง|พัสดุ)|tracking|waybill/i.test(h.replace(/\s/g,"")));if(f){colMap.tracking=f;dbg("w","ใช้หัวตารางสำรองสำหรับเลขพัสดุ:",f)}}
  dbg("l","Column map:",colMap);if(miss.length)dbg("w","ไม่พบคอลัมน์:",miss)}
function val(r,k){const h=colMap[k];if(!h)return"";const v=String(r[h]??"").trim();return v&&v!=="-"?v:""}
function getStatus(r){return val(r,"sign_time")?"signed":val(r,"problem_time")?"problem":val(r,"pending_time")?"pending":val(r,"delivery_time")?"out":"transit"}

async function loadData(){
  try{
    const res=await fetch(CSV_URL,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);
    const text=await res.text();
    if(/^\s*<(!doctype|html)/i.test(text.slice(0,30)))throw new Error('ได้รับหน้า HTML แทน CSV — ชีตอาจไม่ได้แชร์แบบ "ทุกคนที่มีลิงก์ - ดูได้" หรือ SHEET_ID/GID ไม่ถูกต้อง');
    const t=parseCSV(text);if(t.length<2)throw new Error("ไม่พบข้อมูลในชีต");
    const hs=t[0].map(norm);buildColMap(hs);
    rows=t.slice(1).map((r,i)=>{const o={__idx:i};hs.forEach((h,j)=>o[h]=(r[j]||"").trim());o.__s=hs.map(h=>o[h]).join(" ").toLowerCase();return o});
    $("sDot").className="dot ok";$("sText").textContent=`เชื่อมต่อสำเร็จ • ${rows.length} พัสดุ`;
    $("sSync").textContent="อัปเดตล่าสุด "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
    buildChips();render();
  }catch(e){dbg("e","โหลดข้อมูลล้มเหลว:",e.message);$("sDot").className="dot err";$("sText").textContent="เชื่อมต่อไม่สำเร็จ";
    $("grid").innerHTML=`<div class="err">ไม่สามารถโหลดข้อมูลจาก Google Sheet ได้<code>${esc(e.message)}</code></div>`}}

function buildChips(){
  const c={};Object.keys(ST).forEach(k=>c[k]=0);rows.forEach(r=>c[getStatus(r)]++);
  $("chips").innerHTML=["ทั้งหมด",...Object.keys(ST)].map(k=>`<div class="chip ${k===active?"active":""}" data-s="${k}">${k==="ทั้งหมด"?"ทั้งหมด":ST[k][0]} (${k==="ทั้งหมด"?rows.length:c[k]})</div>`).join("");
  $("chips").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{active=el.dataset.s;buildChips();render()})}

function render(){
  const q=$("q").value.trim().toLowerCase(),g=$("grid");$("qc").classList.toggle("show",q.length>0);
  if(!q){
    const n=active==="ทั้งหมด"?rows.length:rows.filter(r=>getStatus(r)===active).length;
    $("count").innerHTML=active==="ทั้งหมด"?`มีพัสดุทั้งหมด <b>${rows.length}</b> รายการ — พิมพ์คำค้นหาเพื่อแสดงข้อมูล`:`เลือกสถานะ "<b>${ST[active][0]}</b>" — พบ ${n} รายการ พิมพ์คำค้นหาเพื่อดูรายละเอียด`;
    g.innerHTML=`<div class="empty"><h3>พิมพ์เพื่อค้นหาพัสดุ</h3>ใส่เลขพัสดุ ชื่อผู้รับ ชื่อผู้ส่ง เบอร์โทร หรือที่อยู่ — ระบบจะไม่แสดงข้อมูลจนกว่าจะค้นหา เพื่อความเป็นส่วนตัวของลูกค้า</div>`;return}
  const f=rows.filter(r=>(active==="ทั้งหมด"||getStatus(r)===active)&&r.__s.includes(q));
  $("count").innerHTML=`พบ <b>${f.length}</b> พัสดุ จากทั้งหมด ${rows.length}`;
  if(!f.length){g.innerHTML=`<div class="empty"><h3>ไม่พบพัสดุที่ค้นหา</h3>ลองตรวจสอบการสะกด หรือค้นหาด้วยคำอื่น</div>`;return}
  g.innerHTML=f.slice(0,200).map(r=>{
    const s=getStatus(r),trk=val(r,"tracking")||"ไม่ระบุเลขพัสดุ",signed=s==="signed",outp=s==="out"||signed;
    const al=s==="pending"?`<div class="alert p">ตกค้าง${val(r,"pending_reason")?" — "+esc(val(r,"pending_reason")):""}</div>`:s==="problem"?`<div class="alert x">มีปัญหา${val(r,"problem_reason")?" — "+esc(val(r,"problem_reason")):""}</div>`:"";
    return `<div class="card" data-i="${r.__idx}"><span class="badge ${ST[s][1]}">${ST[s][0]}</span>
      <div class="trk">${esc(trk)}</div>${al}
      <div class="steps"><div class="step d"><i></i>รับพัสดุ</div><div class="step ${outp?"d":""}"><i></i>นำจ่าย</div><div class="step ${signed?"d":""}"><i></i>เซ็นรับ</div></div>
      <div class="ct">ผู้รับ: ${esc(val(r,"recipient_name")||"ไม่ระบุผู้รับ")}</div>
      ${val(r,"recipient_addr")?`<div class="cs">${esc(val(r,"recipient_addr"))}</div>`:""}
      <div class="meta"><span>${val(r,"sender_name")?"จาก: "+esc(val(r,"sender_name")):""}</span><span>${esc(val(r,"sign_time")||val(r,"delivery_time")||val(r,"branch_arrived"))}</span></div>
      <button class="cbar" data-t="${esc(trk)}">สร้างบาร์โค้ดของพัสดุนี้</button></div>`}).join("");
  g.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.closest(".cbar"))return;const r=rows.find(x=>x.__idx===+c.dataset.i);r&&openModal(r)});
  g.querySelectorAll(".cbar").forEach(b=>b.onclick=e=>{e.stopPropagation();const t=b.dataset.t;if(!t||t==="ไม่ระบุเลขพัสดุ")return;$("bin").value=t;genBarcode(t);$("bin").scrollIntoView({behavior:"smooth",block:"center"})})}

function bc(svg,text,o){JsBarcode(svg,text,Object.assign({format:"CODE128",lineColor:"#15151a",displayValue:true,fontOptions:"600",font:"Prompt, sans-serif",background:"#fff"},o))}
function svgToPng(svg,name){
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:"image/svg+xml;charset=utf-8"})),img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=img.width||400;c.height=img.height||140;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);URL.revokeObjectURL(url);const a=document.createElement("a");a.download=name;a.href=c.toDataURL("image/png");a.click()};img.src=url}
function genBarcode(raw){
  const t=(raw||"").trim();if(!t){$("gres").classList.remove("show");return}
  try{bc($("gsvg"),t,{width:2.4,height:82,fontSize:16,textMargin:6,margin:8});$("glab").textContent="Code128: "+t;$("gres").classList.add("show")}
  catch(e){$("glab").textContent="ไม่สามารถสร้างบาร์โค้ดได้: "+(e.message||e);$("gres").classList.add("show");dbg("e",e.message||String(e))}}
$("bgo").onclick=()=>genBarcode($("bin").value);
$("bin").onkeydown=e=>{if(e.key==="Enter")genBarcode($("bin").value)};
$("blast").onclick=()=>{if(!rows.length)return;const t=val(rows[rows.length-1],"tracking");if(!t)return;$("bin").value=t;genBarcode(t)};
$("gcl").onclick=()=>{$("gres").classList.remove("show");$("bin").value=""};
$("gdl").onclick=()=>svgToPng($("gsvg"),"barcode.png");
$("gpr").onclick=()=>{const w=window.open("","_blank","width=420,height=300");w.document.write(`<body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0">${new XMLSerializer().serializeToString($("gsvg"))}</body>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)};

/* ---------- popup ---------- */
const fr=(l,v)=>v?`<div class="row"><span>${l}</span><span>${esc(v)}</span></div>`:"";
function ts(s){const m=String(s||"").match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime():0}
function buildTimeline(r){
  const e=[{ic:"📦",l:"รับพัสดุเข้าระบบ",t:"",c:""}];
  if(val(r,"branch_arrived"))e.push({ic:"🚚",l:"พัสดุถึงสาขา"+(val(r,"branch_name")?" "+val(r,"branch_name"):""),t:val(r,"branch_arrived"),c:""});
  if(val(r,"delivery_time"))e.push({ic:"🛵",l:"กำลังนำจ่ายพัสดุ",t:val(r,"delivery_time"),c:"",d:val(r,"courier_name")?`พนักงานนำจ่าย: ${val(r,"courier_name")}${val(r,"courier_phone")?" · "+val(r,"courier_phone"):""}`:""});
  if(val(r,"pending_time"))e.push({ic:"⏱",l:"พัสดุตกค้าง",t:val(r,"pending_time"),c:"warn",d:val(r,"pending_reason")});
  if(val(r,"problem_time"))e.push({ic:"!",l:"พัสดุมีปัญหา",t:val(r,"problem_time"),c:"danger",d:val(r,"problem_reason")});
  if(val(r,"sign_time"))e.push({ic:"✓",l:"เซ็นรับสำเร็จ",t:val(r,"sign_time"),c:"ok",d:val(r,"signer")?`ผู้เซ็นรับ: ${val(r,"signer")}${val(r,"sign_branch")?" · "+val(r,"sign_branch"):""}`:""});
  e.sort((a,b)=>ts(a.t)-ts(b.t)); // เรียงตามเวลาจริง (รายการไม่มีเวลาอยู่บนสุด)
  return e.map(x=>`<div class="tl ${x.c}"><div class="tld">${x.ic}</div><div><div class="tll">${esc(x.l)}</div>${x.t?`<div class="tlt">${esc(x.t)}</div>`:""}${x.d?`<div class="tlx">${esc(x.d)}</div>`:""}</div></div>`).join("")}

function openModal(r){
  const s=getStatus(r),trk=val(r,"tracking")||"ไม่ระบุเลขพัสดุ",has=trk!=="ไม่ระบุเลขพัสดุ";
  const rec=fr("ชื่อผู้รับ",val(r,"recipient_name"))+fr("เบอร์โทร",val(r,"recipient_phone"))+fr("ที่อยู่",val(r,"recipient_addr"));
  const snd=fr("ชื่อผู้ส่ง",val(r,"sender_name"))+fr("ร้าน/ลูกค้า",val(r,"sender_source"))+fr("เบอร์โทร",val(r,"sender_phone"))+fr("แหล่งที่มาคำสั่งซื้อ",val(r,"order_source"));
  const pl=[["ประเภท","parcel_type"],["น้ำหนัก","weight"],["ชำระเงิน","payment_method"],["ค่าขนส่ง","shipping_fee"],["COD","cod"]].filter(p=>val(r,p[1])).map(p=>`<div class="pill"><i>${p[0]}</i><b>${esc(val(r,p[1]))}</b></div>`).join("");
  $("modal").innerHTML=`<div class="mhead"><button class="mclose" id="mc">✕</button><span class="badge ${ST[s][1]}" style="margin:0">${ST[s][0]}</span>
    <div class="mtrk">${esc(trk)}</div><div class="msub">70Sawi06 · ใบปะหน้าพัสดุ</div></div>
    <div class="mbody"><div class="cols"><div>
      ${val(r,"cod")?`<div class="cod">COD เก็บปลายทาง ฿${esc(val(r,"cod"))}</div>`:""}
      <div class="rq"><div class="stamp">${esc(val(r,"branch_name")||val(r,"zone_name")||"-")}</div><div class="qr"><canvas id="mqr"></canvas></div></div>
      <div class="bcbox"><svg id="mbc"></svg><div class="cap" id="mcap">บาร์โค้ด Code128 ของเลขพัสดุนี้</div>
        <div><button class="mini" id="mdl">ดาวน์โหลด PNG</button> <button class="mini" id="mpr">พิมพ์ใบปะหน้าพัสดุ</button></div></div>
      <div class="tlh">ไทม์ไลน์การจัดส่ง</div>${buildTimeline(r)}
    </div><div>
      ${rec?`<div class="panel"><div class="ptitle">ผู้รับ</div>${rec}</div>`:""}
      ${snd?`<div class="panel"><div class="ptitle">ผู้ส่ง</div>${snd}</div>`:""}
      ${pl?`<div class="pills">${pl}</div>`:""}
    </div></div></div>`;
  $("ov").classList.add("show");$("mc").onclick=closeModal;
  if(has){
    try{bc($("mbc"),trk,{width:2.1,height:70,fontSize:14,textMargin:5,margin:6})}catch(e){$("mcap").textContent="ไม่สามารถสร้างบาร์โค้ดได้: "+e.message}
    try{QRCode.toCanvas($("mqr"),trk,{width:64,margin:1},err=>err&&dbg("e",err.message))}catch(e){dbg("e",e.message)}
  }
  $("mdl").onclick=()=>svgToPng($("mbc"),`barcode-${trk}.png`);
  $("mpr").onclick=()=>window.print()}
function closeModal(){$("ov").classList.remove("show")}
$("ov").onclick=e=>{if(e.target.id==="ov")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("q").oninput=()=>{clearTimeout(timer);timer=setTimeout(render,150)};
$("qc").onclick=()=>{$("q").value="";$("q").focus();render()};
$("dbgb").onclick=()=>$("dbg").classList.toggle("show");
$("grid").innerHTML=`<div class="empty">กำลังโหลดข้อมูล...</div>`;
loadData();
</script>
</body>
</html>
